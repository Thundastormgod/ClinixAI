name: clinix_app
description: ClinixAI Emergency Triage Tool - AI-powered healthcare for Africa
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3

  # Networking (for Web API calls)
  dio: ^5.4.0

  # Utilities
  uuid: ^4.2.2
  intl: ^0.18.1
  equatable: ^2.0.5
  json_annotation: ^4.8.1

  # UI Components
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  json_serializable: ^6.7.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
