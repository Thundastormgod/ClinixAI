[build]
  # Build command - switch to web pubspec, then build
  command = "cd clinix_app && cp pubspec_web.yaml pubspec.yaml && flutter pub get && flutter build web --release -t lib/main_web.dart"
  publish = "clinix_app/build/web"

[build.environment]
  # Use Flutter stable channel
  FLUTTER_VERSION = "3.24.0"

[[redirects]]
  # SPA routing - redirect all routes to index.html
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  # Headers for all files
  for = "/*"
  [headers.values]
    # Security headers
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    
    # Allow connections to localhost for local backend
    # Note: This doesn't bypass browser CORS - users need local backend running
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; connect-src 'self' http://localhost:* ws://localhost:*; img-src 'self' data: blob:; font-src 'self' data:;"

[[headers]]
  # Cache static assets
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  # Don't cache HTML
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
