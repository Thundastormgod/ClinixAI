# ClinixAI Docker Compose - Local Development Stack
# Architecture: llama.cpp (local fast LLM) + OpenRouter (cloud escalation)
# 
# Run: docker-compose up -d
# Stop: docker-compose down

version: '3.8'

services:
  # ==================== DATABASES ====================
  
  # PostgreSQL - Primary Database
  postgres:
    image: postgres:15-alpine
    container_name: clinixai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: clinixai
      POSTGRES_USER: clinixai_user
      POSTGRES_PASSWORD: clinixai_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/database/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinixai_user -d clinixai"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - clinixai-network

  # Redis - Caching & Session Management
  redis:
    image: redis:7-alpine
    container_name: clinixai-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - clinixai-network

  # ==================== BACKEND SERVICES ====================

  # API Gateway (Node.js)
  api-gateway:
    build:
      context: ./backend/api-gateway
      dockerfile: Dockerfile
    container_name: clinixai-api-gateway
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://clinixai_user:clinixai_dev_password@postgres:5432/clinixai
      REDIS_URL: redis://redis:6379
      JWT_SECRET: your-super-secret-jwt-key-change-in-production
      TRIAGE_SERVICE_URL: http://triage-service:8000
      EHR_BRIDGE_URL: http://ehr-bridge:3001
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/api-gateway:/app
      - /app/node_modules
    networks:
      - clinixai-network

  # Triage Service (Python/FastAPI) - LangGraph AI Orchestration
  triage-service:
    build:
      context: ./backend/triage-service
      dockerfile: Dockerfile
    container_name: clinixai-triage-service
    restart: unless-stopped
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql://clinixai_user:clinixai_dev_password@postgres:5432/clinixai
      REDIS_URL: redis://redis:6379
      # Neo4j Knowledge Graph Configuration
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-clinixai_neo4j_password}
      # ==================== PRIMARY AI BACKENDS ====================
      # llama.cpp - Fast local LLM (handles standard cases)
      LLAMA_CPP_URL: http://llama-cpp:8080
      # OpenRouter - Cloud LLM (handles critical/urgent cases)
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-your-openrouter-key}
      OPENROUTER_DEFAULT_MODEL: ${OPENROUTER_DEFAULT_MODEL:-anthropic/claude-3.5-sonnet}
      OPENROUTER_CRITICAL_MODEL: ${OPENROUTER_CRITICAL_MODEL:-openai/gpt-4o}
      OPENROUTER_SIMPLE_MODEL: ${OPENROUTER_SIMPLE_MODEL:-meta-llama/llama-3.1-70b-instruct}
      OPENROUTER_SITE_URL: ${OPENROUTER_SITE_URL:-https://clinixai.health}
      OPENROUTER_SITE_NAME: ${OPENROUTER_SITE_NAME:-ClinixAI}
      # ==================== AI ROUTING CONFIGURATION ====================
      # Routing: Local-first, cloud for critical/complex cases
      AI_CLOUD_RISK_THRESHOLD: ${AI_CLOUD_RISK_THRESHOLD:-0.7}
      AI_CLOUD_COMPLEXITY_THRESHOLD: ${AI_CLOUD_COMPLEXITY_THRESHOLD:-0.7}
      AI_PREFER_LOCAL: ${AI_PREFER_LOCAL:-true}
      LOCAL_LLM_MAX_TOKENS: ${LOCAL_LLM_MAX_TOKENS:-512}
      LOCAL_LLM_TEMPERATURE: ${LOCAL_LLM_TEMPERATURE:-0.3}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/triage-service:/app
      - ./models:/app/models
    networks:
      - clinixai-network

  # EHR Bridge Service (Node.js + HAPI FHIR)
  ehr-bridge:
    build:
      context: ./backend/ehr-bridge
      dockerfile: Dockerfile
    container_name: clinixai-ehr-bridge
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 3001
      DATABASE_URL: postgresql://clinixai_user:clinixai_dev_password@postgres:5432/clinixai
      FHIR_SERVER_URL: http://hapi-fhir:8080/fhir
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/ehr-bridge:/app
      - /app/node_modules
    networks:
      - clinixai-network

  # HAPI FHIR Server (for EHR interoperability)
  hapi-fhir:
    image: hapiproject/hapi:v7.0.3
    container_name: clinixai-hapi-fhir
    restart: unless-stopped
    environment:
      hapi.fhir.default_encoding: json
      hapi.fhir.allow_multiple_delete: true
      hapi.fhir.reuse_cached_search_results_millis: 60000
    ports:
      - "8080:8080"
    volumes:
      - hapi_data:/data/hapi
    networks:
      - clinixai-network

  # ==================== MONITORING ====================

  # Adminer - Database GUI
  adminer:
    image: adminer:latest
    container_name: clinixai-adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    depends_on:
      - postgres
    networks:
      - clinixai-network

  # Redis Commander - Redis GUI
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: clinixai-redis-commander
    restart: unless-stopped
    environment:
      REDIS_HOSTS: local:redis:6379
    ports:
      - "8082:8081"
    depends_on:
      - redis
    networks:
      - clinixai-network

  # ==================== LLAMA.CPP SERVER (PRIMARY LOCAL LLM) ====================
  # llama.cpp server - fastest CPU inference, OpenAI-compatible API
  # Handles all standard triage cases locally for speed and privacy
  # 
  # SETUP: Run download_model.ps1 first to download a GGUF model
  # Then: docker-compose up -d llama-cpp
  
  llama-cpp:
    image: ghcr.io/ggerganov/llama.cpp:server
    container_name: clinixai-llama-cpp
    restart: unless-stopped
    ports:
      - "8091:8080"
    volumes:
      - ./models/gguf:/models:ro
    command: >
      --host 0.0.0.0
      --port 8080
      --model /models/qwen2.5-1.5b-instruct-q4_k_m.gguf
      --ctx-size 2048
      --threads 4
      --n-predict 512
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    networks:
      - clinixai-network

  # ==================== NEO4J GRAPH DATABASE ====================
  # Neo4j for GraphRAG - Knowledge Graph storage and queries
  
  neo4j:
    image: neo4j:5.15-community
    container_name: clinixai-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/clinixai_neo4j_password
      NEO4J_PLUGINS: '["apoc", "graph-data-science"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*,gds.*
      NEO4J_dbms_memory_heap_initial__size: 512m
      NEO4J_dbms_memory_heap_max__size: 1G
    ports:
      - "7475:7474"  # HTTP Browser (7475 to avoid conflict)
      - "7688:7687"  # Bolt Protocol (7688 to avoid conflict)
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_import:/var/lib/neo4j/import
      - neo4j_plugins:/plugins
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:7474"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - clinixai-network

  # Neo4j Browser alternative (optional lightweight UI)
  # Access Neo4j Browser directly at http://localhost:7474

# ==================== VOLUMES ====================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  hapi_data:
    driver: local
  neo4j_data:
    driver: local
  neo4j_logs:
    driver: local
  neo4j_import:
    driver: local
  neo4j_plugins:
    driver: local

# ==================== NETWORKS ====================
networks:
  clinixai-network:
    driver: bridge
